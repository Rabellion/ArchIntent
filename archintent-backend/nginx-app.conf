# =====================================================================
#  Custom nginx directives, merged into heroku-buildpack-php's generated
#  server block via `heroku-php-nginx -C nginx-app.conf public/`.
#  Docs: https://devcenter.heroku.com/articles/php-support#custom-nginx-configuration
#
#  Purpose: proxy WebSocket upgrade requests to the Reverb process
#  running internally on 127.0.0.1:8080 (started by Procfile), so a
#  single public hostname/port serves both the HTTP API and the
#  WebSocket connection Laravel Echo uses for real-time chat.
#
#  Reverb implements the Pusher protocol, whose JS client always
#  connects to /app/{key} — that path match below is not arbitrary,
#  it is what Laravel Echo / pusher-js actually requests.
# =====================================================================

location /app/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Reverb's server-side HTTP API (used by the backend itself, e.g. the
# `broadcasting/auth` route which is handled by Laravel directly — this
# block covers Reverb's own /apps/{id}/events-style endpoints in case
# anything calls them directly rather than through the queue/job layer).
location /apps/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
