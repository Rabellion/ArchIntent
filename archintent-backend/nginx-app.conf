# =====================================================================
#  Custom nginx directives, merged into heroku-buildpack-php's generated
#  server block via `heroku-php-nginx -C nginx-app.conf public/`.
#  Docs: https://devcenter.heroku.com/articles/php-support#custom-nginx-configuration
#
#  IMPORTANT: this file is included at SERVER level, which means it
#  REPLACES the buildpack's default `location /` block. Laravel's front
#  controller routing therefore has to be declared here explicitly --
#  without it every non-file URL 404s, because nginx looks for a literal
#  file (e.g. /app/public/api/health) instead of handing off to
#  index.php. That is exactly what happened on the first deploy.
# =====================================================================

# ---- Laravel front controller ---------------------------------------
# Every request that is not a real file on disk goes to index.php.
location / {
    try_files $uri $uri/ /index.php$is_args$args;
}

# ---- Reverb WebSocket upgrade ---------------------------------------
# Reverb runs in the background on 127.0.0.1:8080 (see Procfile) and is
# never exposed directly by Heroku's router. Proxying it here means one
# public hostname serves both the HTTP API and the WebSocket connection.
#
# Reverb implements the Pusher protocol, whose JS client always connects
# to /app/{key} -- this path match is what Laravel Echo actually
# requests, not an arbitrary choice. nginx prefers the longer prefix, so
# this wins over `location /` above.
location /app/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Reverb's own HTTP API (server-to-server event publishing).
location /apps/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
